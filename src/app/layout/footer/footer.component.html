<footer>
  <div class="container">
    <div class="footer__container" fxLayout="row" fxLayoutAlign="space-between">
      <div class="footer__logo">
        <p class="text-muted footer__powered-by">
          <span>Powered by</span>
          <img
            class="footer__logo--mdm"
            src="assets/images/mdm-logo.png"
            alt="Mauro Data Mapper logo"
          />
        </p>
      </div>

      <div class="footer__right">
        <small class="text-muted footer__line">Version {{ version }}</small>
        <small class="text-muted footer__line"
          >Copyright &copy; {{ year }} NHS England</small
        >
      </div>
    </div>
  </div>
</footer>
